<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin — Chá da Aurora 🌸</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 30px 15px; }
  .container { max-width: 950px; margin: 0 auto; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🌸 Painel Admin — Chá da Aurora</h1>

    <h2>✨ Cadastrar convidado</h2>
    <input id="nome" placeholder="Nome do convidado">
    <input id="email" placeholder="E-mail do convidado">
    <select id="fralda">
      <option value="RN">Fralda RN</option>
      <option value="P">Fralda P</option>
      <option value="M" selected>Fralda M</option>
      <option value="G">Fralda G</option>
      <option value="GG">Fralda GG</option>
    </select>
    <select id="mimo">
      <option value="sim">Com mimo</option>
      <option value="nao">Sem mimo</option>
    </select>
    <button id="btnCadastrar">Cadastrar</button>
    <p id="msg"></p>

    <h2>📊 Relatório</h2>
    <div class="stats">
      <div class="stat total">
        <span class="num" id="statTotal">0</span>
        <span class="lbl">Total</span>
      </div>
      <div class="stat confirmado">
        <span class="num" id="statConf">0</span>
        <span class="lbl">Confirmados</span>
      </div>
      <div class="stat pendente">
        <span class="num" id="statPend">0</span>
        <span class="lbl">Pendentes</span>
      </div>
      <div class="stat fraldas">
        <span class="num" id="statFraldas">0</span>
        <span class="lbl">Fraldas</span>
      </div>
    </div>

    <h2>🎀 Lista de convidados</h2>
    <div style="margin: 10px 0;">
      <label><input type="radio" name="filtro" value="todos" checked> Todos</label>
      <label style="margin-left:15px;"><input type="radio" name="filtro" value="confirmados"> Confirmados</label>
      <label style="margin-left:15px;"><input type="radio" name="filtro" value="pendentes"> Pendentes</label>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Fralda</th>
          <th>Mimo</th>
          <th>Confirmou?</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { db } from './firebase.js';
import { collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

document.getElementById('btnCadastrar').addEventListener('click', async () => {
  const nome = document.getElementById('nome').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const fralda = document.getElementById('fralda').value;
  const mimo = document.getElementById('mimo').value;
  const msg = document.getElementById('msg');

  if (!nome || !email) {
    msg.textContent = '⚠️ Preencha nome e e-mail';
    msg.style.color = 'orange';
    return;
  }

  try {
    await setDoc(doc(db, 'convidados', email), {
      nome, email, fralda, mimo,
      confirmado: false,
      criadoEm: new Date().toISOString()
    });
    msg.textContent = '✅ Convidado cadastrado!';
    msg.style.color = 'green';
    document.getElementById('nome').value = '';
    document.getElementById('email').value = '';
  } catch (e) {
    console.error(e);
    msg.textContent = '❌ Erro: ' + e.message;
    msg.style.color = 'red';
  }
});

let todosConvidados = [];

onSnapshot(collection(db, 'convidados'), (snap) => {
  todosConvidados = [];
  snap.forEach(d => todosConvidados.push(d.data()));
  atualizarStats();
  renderLista();
});

document.querySelectorAll('input[name="filtro"]').forEach(r => {
  r.addEventListener('change', renderLista);
});

function atualizarStats() {
  const total = todosConvidados.length;
  const confirmados = todosConvidados.filter(c => c.confirmado).length;
  const pendentes = total - confirmados;

  const contagem = {};
  todosConvidados.forEach(c => { contagem[c.fralda] = (contagem[c.fralda] || 0) + 1; });
  const fraldasTexto = Object.entries(contagem).map(([k, v]) => `${v} ${k}`).join(' · ') || '0';

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statConf').textContent = confirmados;
  document.getElementById('statPend').textContent = pendentes;
  document.getElementById('statFraldas').textContent = fraldasTexto;
}

function renderLista() {
  const filtro = document.querySelector('input[name="filtro"]:checked').value;
  const lista = document.getElementById('lista');
  lista.innerHTML = '';

  let filtrados = todosConvidados;
  if (filtro === 'confirmados') filtrados = todosConvidados.filter(c => c.confirmado);
  if (filtro === 'pendentes') filtrados = todosConvidados.filter(c => !c.confirmado);

  if (filtrados.length === 0) {
    lista.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">Nenhum convidado aqui ainda 🌸</td></tr>';
    return;
  }

  filtrados.forEach(c => {
    const base = location.origin + location.pathname.replace('admin.html', 'index.html');
    const link = base + '?email=' + encodeURIComponent(c.email);
    lista.innerHTML += '<tr>' +
      '<td>' + c.nome + '</td>' +
      '<td>' + c.email + '</td>' +
      '<td>' + c.fralda + '</td>' +
      '<td>' + c.mimo + '</td>' +
      '<td class="' + (c.confirmado ? 'ok' : 'no') + '">' + (c.confirmado ? 'Sim ✅' : 'Ainda não') + '</td>' +
      '<td><a href="' + link + '" target="_blank">Abrir</a></td>' +
      '</tr>';
  });
}
</script>
</body>
</html>
