<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7b1fa2">
<title>Confirmar Presença — Chá da Aurora 🌸</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; min-height:100vh; width:100%;
    font-family:'Comic Sans MS','Quicksand',sans-serif;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    font-size: 16px;
  }
  body {
    padding: 20px 12px;
    background: linear-gradient(135deg, #4a1a5e, #7b1fa2 50%, #b39ddb);
    background-attachment:fixed;
    display:flex; justify-content:center; align-items:flex-start;
    position:relative;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .particula {
    position:fixed; pointer-events:none; font-size:1.2em; opacity:0.7;
    animation: subir linear infinite; z-index:1;
  }
  @keyframes subir {
    0% { transform: translateY(100vh) rotate(0); opacity:0; }
    10%,90% { opacity:0.8; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity:0; }
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: linear-gradient(180deg, rgba(255,253,247,0.98), rgba(250,240,255,0.98));
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 22px;
    padding: 26px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 3px solid #ffd54f;
    text-align:center;
    position: relative; z-index: 5;
  }
  .coroa-topo {
    font-size: 2.4em; margin-bottom: 5px;
    filter: drop-shadow(0 4px 8px rgba(230,81,0,0.4));
  }
  h1 { font-size:1.7em; margin:0 0 5px; color:#7b1fa2; text-shadow: 1px 1px 0 #ffd54f; }
  h2 { font-weight:normal; margin-top:0; font-size:0.95em; color:#c2185b; }
  .voltar {
    display:inline-block; margin-bottom:12px; color:#7b1fa2;
    text-decoration:none; font-size:0.88em; font-weight:bold;
    padding: 8px 12px; border-radius: 10px;
    touch-action: manipulation;
  }
  .voltar:active { background: rgba(123,31,162,0.1); }

  .form { text-align:left; margin-top:18px; }
  .form label {
    font-size:0.9em; color:#7b1fa2; font-weight:bold;
    display:block; margin-top:14px; margin-bottom:5px;
  }
  .form input, .form select, .acomp-item input {
    width:100%; padding:13px;
    border-radius:12px; border:2px solid #e1bee7;
    font-size: 16px !important;
    font-family:inherit; background:white;
    transition: border-color 0.2s;
    min-height: 48px;
    touch-action: manipulation;
  }
  .form input:focus, .form select:focus, .acomp-item input:focus {
    outline:none; border-color:#c2185b;
    box-shadow:0 0 0 3px rgba(194,24,91,0.15);
  }

  .aviso {
    background: linear-gradient(135deg, rgba(255,243,224,0.95), rgba(255,235,238,0.95));
    border-left:5px solid #f9a825;
    border-radius:12px; padding:13px 16px; margin-top:15px;
    font-size:0.9em; text-align:left;
  }
  .aviso strong { color:#e65100; }

  .acompanhantes { margin-top:18px; }
  .acomp-item {
    display:flex; gap:8px; align-items:center;
    background:white; padding:10px; border-radius:12px;
    margin-bottom:8px; border:2px solid #f3e5f5;
  }
  .acomp-item input { margin:0; flex:1; padding:11px; }
  .btn-remover {
    background:#ef5350; color:white; border:none;
    border-radius:10px; padding:0 14px; cursor:pointer;
    font-weight:bold; flex-shrink:0;
    min-height: 48px;
    font-size: 1em;
    touch-action: manipulation;
  }
  .btn-remover:active { transform: scale(0.95); }
  .btn-add {
    background:white; color:#c2185b;
    border:2px dashed #c2185b; border-radius:12px;
    padding:13px 15px; cursor:pointer;
    font-weight:bold; width:100%; margin-top:5px;
    font-family:inherit; font-size:0.95em;
    transition: background 0.2s;
    min-height: 50px;
    touch-action: manipulation;
  }
  .btn-add:active { background:#fce4ec; }

  .btn-enviar {
    width:100%; margin-top:22px;
    padding:16px; font-size:1.05em; border-radius:30px;
    border:none; background: linear-gradient(135deg,#66bb6a,#2e7d32);
    color:white; font-weight:bold; cursor:pointer;
    box-shadow: 0 6px 20px rgba(46,125,50,0.4);
    transition: transform 0.2s;
    font-family:inherit;
    min-height: 54px;
    touch-action: manipulation;
  }
  .btn-enviar:active { transform: scale(0.98); }
  .btn-enviar:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

  .sucesso {
    background: linear-gradient(180deg,#e8f5e9,#c8e6c9);
    border:3px solid #66bb6a;
    border-radius:16px; padding:28px 20px; margin-top:15px;
    color:#1b5e20; text-align:center;
  }
  .sucesso .emoji { font-size:3em; animation: pulsar-emoji 1.5s infinite; display:inline-block; }
  @keyframes pulsar-emoji { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .sucesso h3 { color:#1b5e20; margin:12px 0; font-size:1.3em; }
  .sucesso p { font-size: 0.95em; }

  .erro-msg { color:#c62828; font-weight:bold; margin-top:10px; text-align:center; }

  @media (max-width: 400px) {
    .card { padding: 22px 16px; border-radius: 18px; }
    h1 { font-size: 1.4em; }
    h2 { font-size: 0.88em; }
    .coroa-topo { font-size: 2em; }
    .form label { font-size: 0.85em; }
    .form input, .form select, .acomp-item input { padding: 12px; }
    .aviso { font-size: 0.85em; padding: 11px 13px; }
    .sucesso { padding: 22px 14px; }
    .sucesso .emoji { font-size: 2.4em; }
  }
</style>
</head>
<body>
<div id="particulas"></div>

<div class="card">
  <a href="index.html" class="voltar">← Voltar ao convite</a>
  <div class="coroa-topo">👑</div>
  <h1>Confirme sua presença</h1>
  <h2>Chá de Bebê da Aurora 🌟</h2>

  <div id="formBox">
    <div class="form">
      <label>Seu nome completo *</label>
      <input id="fNome" placeholder="Digite seu nome" autocomplete="name">

      <label>Fralda que vai trazer *</label>
      <select id="fFralda">
        <option value="M" selected>👶 Fralda Tamanho M</option>
        <option value="G">👶 Fralda Tamanho G</option>
      </select>

      <div class="aviso">
        🎁 <strong>Mimo obrigatório!</strong><br>
        <span style="color:#555;">Traga <strong>um mimo</strong> para a Aurora <em>ou</em> para a mamãe — você escolhe!</span>
      </div>

      <div class="acompanhantes">
        <label>👥 Família / Acompanhantes</label>
        <p style="font-size:0.85em;color:#666;margin:4px 0 8px;">
          Adicione o nome de cada familiar que virá com você. Se vier sozinho(a), deixe em branco.
        </p>
        <div id="listaAcomp"></div>
        <button type="button" class="btn-add" id="btnAddAcomp">➕ Adicionar familiar</button>
      </div>

      <button class="btn-enviar" id="btnEnviar">✅ Confirmar presença</button>
      <p class="erro-msg" id="erro"></p>
    </div>
  </div>
</div>

<script type="module">
import { db } from './firebase.js';
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const simbolos = ['✦','✧','🌸','💜','✨','👑','💕','⭐'];
const cont = document.getElementById('particulas');
for (let i = 0; i < 15; i++) {
  const p = document.createElement('div');
  p.className = 'particula';
  p.textContent = simbolos[Math.floor(Math.random()*simbolos.length)];
  p.style.left = Math.random()*100 + 'vw';
  p.style.animationDuration = (8+Math.random()*8)+'s';
  p.style.animationDelay = (Math.random()*8)+'s';
  cont.appendChild(p);
}

const listaAcomp = document.getElementById('listaAcomp');
let contAcomp = 0;

document.getElementById('btnAddAcomp').addEventListener('click', () => {
  contAcomp++;
  const id = contAcomp;
  const div = document.createElement('div');
  div.className = 'acomp-item';
  div.id = 'acomp-' + id;
  div.innerHTML = `
    <input placeholder="Nome do familiar" class="acomp-nome" autocomplete="off">
    <button type="button" class="btn-remover">✕</button>
  `;
  div.querySelector('.btn-remover').addEventListener('click', () => div.remove());
  listaAcomp.appendChild(div);
  setTimeout(() => div.querySelector('input').focus(), 100);
});

document.getElementById('btnEnviar').addEventListener('click', async () => {
  const btn = document.getElementById('btnEnviar');
  const erro = document.getElementById('erro');
  erro.textContent = '';

  const nome = document.getElementById('fNome').value.trim();
  const fralda = document.getElementById('fFralda').value;

  if (!nome) { erro.textContent = '⚠️ Preencha seu nome'; return; }

  const acompanhantes = [];
  document.querySelectorAll('.acomp-item').forEach(item => {
    const an = item.querySelector('.acomp-nome').value.trim();
    if (an) acompanhantes.push({ nome: an });
  });

  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';

  try {
    const idDoc = Date.now().toString() + '-' + nome.toLowerCase().replace(/\s+/g,'-').slice(0,20);

    await setDoc(doc(db, 'convidados', idDoc), {
      nome,
      fralda,
      mimo: 'sim',
      acompanhantes,
      totalPessoas: 1 + acompanhantes.length,
      confirmado: true,
      criadoEm: new Date().toISOString()
    });

    document.getElementById('formBox').innerHTML = `
      <div class="sucesso">
        <div class="emoji">🎉</div>
        <h3>Presença confirmada!</h3>
        <p>Obrigado, <strong>${nome}</strong>!</p>
        <p>Você confirmou <strong>${1 + acompanhantes.length}</strong> pessoa(s) e vai trazer <strong>fralda ${fralda}</strong>.</p>
        <p>🎁 E um mimo especial — a Aurora agradece! 💕</p>
        <p style="margin-top:18px;">Nos vemos em <strong>29 de Novembro de 2026</strong>!</p>
        <p style="font-size:0.85em;color:#555;">📍 Estrada do Pium, 4145 — Mogi das Cruzes/SP</p>
      </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    console.error(e);
    erro.textContent = '❌ Erro ao enviar: ' + e.message;
    btn.disabled = false;
    btn.textContent = '✅ Confirmar presença';
  }
});
</script>
</body>
</html>
