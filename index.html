<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Chá de Bebê da Aurora 🌸</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
  }
  .card {
    max-width: 620px;
    text-align: center;
    padding: 50px 40px;
  }
  h1 {
    font-size: 3em;
    margin: 0 0 5px;
  }
  h2 {
    font-weight: normal;
    margin-top: 0;
    font-size: 1.3em;
  }
  .info {
    background: linear-gradient(135deg, #fce4ec, #f3e5f5);
    padding: 18px;
    border-radius: 15px;
    margin: 25px 0;
    border: 2px dashed #f8bbd0;
  }
  .fralda {
    font-size: 1.6em;
    color: #c2185b;
    font-weight: bold;
    margin: 20px 0;
  }
  button {
    padding: 15px 40px;
    font-size: 18px;
    border-radius: 30px;
    margin-top: 20px;
  }
  .confirmado {
    color: #2e7d32;
    font-size: 1.3em;
    font-weight: bold;
    margin-top: 20px;
  }
  .estrelas { font-size: 1.5em; letter-spacing: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="estrelas">✦ ✧ ✦ ✧ ✦</div>
  <h1>Aurora 🌟</h1>
  <h2>Chá de Bebê</h2>
  <p><strong>Moises & Beatriz</strong> convidam você para celebrar<br>a chegada da nossa pequena Aurora.</p>

  <div class="info">
    <p>📅 <strong>Novembro de 2026</strong></p>
    <p>📍 Local: (a definir)</p>
  </div>

  <div id="conteudo"></div>
  <div class="estrelas" style="margin-top:25px;">✦ ✧ ✦ ✧ ✦</div>
</div>

<script type="module">
import { db } from './firebase.js';
import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const params = new URLSearchParams(location.search);
const email = params.get('email');
const conteudo = document.getElementById('conteudo');

if (!email) {
  conteudo.innerHTML = '<p>💌 Por favor, use o link exclusivo enviado por Moises & Beatriz.</p>';
} else {
  const ref = doc(db, 'convidados', email);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    conteudo.innerHTML = '<p>Convidado não encontrado. Fale com Moises ou Beatriz. 🌸</p>';
  } else {
    const c = snap.data();
    conteudo.innerHTML = `
      <p>Olá, <strong>${c.nome}</strong>! 💕</p>
      <p>Você foi escolhido(a) para trazer:</p>
      <p class="fralda">👶 Fralda tamanho ${c.fralda}</p>
      ${c.mimo === 'sim' ? '<p>🎁 E um mimo especial!</p>' : ''}
      <div id="rsvp"></div>
    `;

    const rsvp = document.getElementById('rsvp');
    if (c.confirmado) {
      rsvp.innerHTML = '<p class="confirmado">✅ Presença confirmada. Até lá! 🌸</p>';
    } else {
      const btn = document.createElement('button');
      btn.textContent = '✨ Confirmar presença ✨';
      btn.onclick = async () => {
        await updateDoc(ref, { confirmado: true });
        rsvp.innerHTML = '<p class="confirmado">✅ Presença confirmada. Até lá! 🌸</p>';
      };
      rsvp.appendChild(btn);
    }
  }
}
</script>
</body>
</html>
